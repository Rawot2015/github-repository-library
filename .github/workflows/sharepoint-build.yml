name: SharePoint static build

on:
  push:
    branches:
      - sharepoint-static-deployment
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run build:sharepoint
      - name: Verify SharePoint single-file output
        run: |
          test -f out/index.html
          test -f out/RepoShelf.html
          test -s out/RepoShelf.html
          if grep -Eiq '<link[^>]+rel=["'\''"]stylesheet["'\'']|<script[^>]+src=|@font-face' out/RepoShelf.html; then
            echo "External CSS, JS, or font references remain in RepoShelf.html"
            exit 1
          fi
          echo "SharePoint single-file build is self-contained."
