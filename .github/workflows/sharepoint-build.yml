name: SharePoint static build

on:
  push:
    branches:
      - sharepoint-static-deployment
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Verify static output
        run: |
          test -f out/index.html
          test -d out/_next
          test -n "$(find out/_next -type f | head -1)"
